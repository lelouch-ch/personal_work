spring:
  application:
    name: pwt-server
  datasource:
    url: jdbc:mysql://${PWT_DB_HOST:192.168.124.108}:${PWT_DB_PORT:3306}/${PWT_DB_NAME:personal_test}?useSSL=false&allowPublicKeyRetrieval=true&requireSSL=false&characterEncoding=utf8&connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true&preserveInstants=true&rewriteBatchedStatements=true
    username: ${PWT_DB_USER:root}
    password: ${PWT_DB_PASSWORD:zghz@123}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      pool-name: pwt-pool
      maximum-pool-size: ${PWT_DB_POOL_SIZE:10}
      minimum-idle: 2
      # 任务领取使用 FOR UPDATE SKIP LOCKED，事务应保持简短，这里只做连接保护
      connection-timeout: 10000
      max-lifetime: 1740000
  flyway:
    enabled: true
    baseline-on-migrate: false
    locations: classpath:db/migration
    encoding: UTF-8

server:
  port: ${PWT_SERVER_PORT:8080}
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
    db-config:
      id-type: input
    # 软删除（deleted_at）当前由 Repository 显式追加 IS NULL 条件，
    # 不启用 MP 全局逻辑删除：其 null 语义会渲染成 `deleted_at = null`，在 MySQL 下永不匹配。
    # M2 若改为全局逻辑删除，必须先验证生成的 SQL 为 IS NULL。

pwt:
  identity:
    # HS256 签名密钥：必须通过环境变量注入，长度不少于 32 字符（设计文档 18.2）
    owner-jwt-secret: ${PWT_OWNER_JWT_SECRET:qYj0y8Spyj4dYCLjjrt4mO6Z5OmB2Qgh}
    owner-token-ttl: ${PWT_OWNER_TOKEN_TTL:12h}
    owner-token-issuer: pwt
    # Agent 密钥摘要的 pepper，可为空；生产环境建议配置
    agent-token-pepper: ${PWT_AGENT_TOKEN_PEPPER:}
    agent-clock-skew: 30s
  bootstrap:
    # 首次启动时创建 Owner；库中已有用户则跳过
    enabled: ${PWT_BOOTSTRAP_ENABLED:true}
    username: ${PWT_BOOTSTRAP_USERNAME:owner}
    password: ${PWT_BOOTSTRAP_PASSWORD:}
    display-name: ${PWT_BOOTSTRAP_DISPLAY_NAME:Owner}
  # 异步任务 Worker（设计文档 17.2）：领取与租约参数。
  # lease-duration 必须大于单任务最长正常执行时间，否则租约回收会把仍在执行的任务重复投递。
  task:
    enabled: ${PWT_TASK_ENABLED:true}
    poll-interval: ${PWT_TASK_POLL_INTERVAL:5s}
    batch-size: ${PWT_TASK_BATCH_SIZE:10}
    lease-duration: ${PWT_TASK_LEASE_DURATION:5m}
    recovery-interval: ${PWT_TASK_RECOVERY_INTERVAL:60s}
    backoff-base: ${PWT_TASK_BACKOFF_BASE:30s}
    max-retry-attempts: ${PWT_TASK_MAX_RETRIES:5}
  # 记忆自动批准阈值（设计文档 6.3）：阈值可配置而不是硬编码。
  # max-auto-approve-risk-level 提高一档即放宽自动批准，L2 及以上默认必须人工审核。
  memory:
    auto-approve-enabled: ${PWT_MEMORY_AUTO_APPROVE:true}
    max-auto-approve-risk-level: ${PWT_MEMORY_MAX_AUTO_RISK:L1}
    auto-approve-min-confidence: ${PWT_MEMORY_MIN_CONFIDENCE:0.85}
    preference-min-evidence: ${PWT_MEMORY_PREFERENCE_MIN_EVIDENCE:2}
  # LLM Provider（设计文档 12.1）：endpoint 与 api-key 同时配置才会启用真实调用，
  # 否则退化为“未配置”实现，提取任务会明确失败并重试，不会伪造提取结果。
  llm:
    provider-code: ${PWT_LLM_PROVIDER:openai-compatible}
    endpoint: ${PWT_LLM_ENDPOINT:}
    model: ${PWT_LLM_MODEL:gpt-4o-mini}
    api-key: ${PWT_LLM_API_KEY:}
    timeout: ${PWT_LLM_TIMEOUT:60s}
    max-retries: ${PWT_LLM_MAX_RETRIES:1}
    max-output-tokens: ${PWT_LLM_MAX_OUTPUT_TOKENS:2000}
    temperature: ${PWT_LLM_TEMPERATURE:0.2}
  # Context Builder（设计文档 11.4、11.5）：候选规模与各段配额。
  # 权重与评分规则固定在代码里（ContextWeights），这里只放需要按模型/语料调整的旋钮。
  # type-quotas 顺序即优先级，缺省的类型不受限。
  context:
    default-token-budget: ${PWT_CONTEXT_TOKEN_BUDGET:4000}
    min-token-budget: ${PWT_CONTEXT_MIN_TOKEN_BUDGET:500}
    max-token-budget: ${PWT_CONTEXT_MAX_TOKEN_BUDGET:20000}
    max-candidates: ${PWT_CONTEXT_MAX_CANDIDATES:60}
    type-quotas:
      - type: fact
        limit: 4
      - type: preference
        limit: 3
      - type: experience
        limit: 4
      - type: decision
        limit: 3
      - type: goal
        limit: 2

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

logging:
  # 日志含中文：固定 UTF-8，避免在 GBK 控制台出现乱码；
  # 旧版 conhost 需先执行 chcp 65001，Windows Terminal + PowerShell 7 默认已就绪
  charset:
    console: UTF-8
    file: UTF-8
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%X{requestId:-}] %logger{36} : %msg%n"
  level:
    com.example.pwt: INFO
    org.springframework.jdbc.datasource.DataSourceTransactionManager: WARN
